name: Feature request
description: Suggest a new tool, skill, command or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "Name the Commander or KSM command involved, if any, and say whether it reads or changes data."
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: "Could this expose secrets or change a tenant? How should it be gated or confirmed?"
